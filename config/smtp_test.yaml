admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901 # Envoy 的管理后台，可以查看统计数据

static_resources:
  listeners:
  - name: listener_smtp
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 2525
    filter_chains:
    - filters:
      - name: envoy.filters.network.smtp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.smtp_proxy.v3.SmtpProxy
          stat_prefix: "smtp_custom"
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: "tcp_smtp"
          cluster: "smtp_upstream_cluster"
      transport_socket: 
        name: envoy.transport_sockets.starttls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.starttls.v3.StartTlsConfig
          cleartext_socket_config: {}
          tls_socket_config:
            common_tls_context: 
              tls_certificates:
              - certificate_chain:
                  filename: "/home/hubin/workspace/envoy-filters_ours/cert.pem"
                private_key:
                  filename: "/home/hubin/workspace/envoy-filters_ours/key.pem"

  clusters:
  - name: smtp_upstream_cluster
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: smtp_upstream_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1 
                port_value: 2500