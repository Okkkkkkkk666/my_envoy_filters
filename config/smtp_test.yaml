static_resources:
  listeners:
  - name: smtp_listener
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 2525 # Envoy 监听的对外端口
    filter_chains:
    - filters:
      # 1. 我们的自定义 SMTP Proxy Filter
      - name: envoy.filters.network.smtp_proxy
        typed_config:
          # 这里的 @type 必须与 proto 文件中的 package 路径加上 message 名字完全对应
          "@type": type.googleapis.com/envoy.extensions.filters.network.smtp_proxy.v3.SmtpProxy
          stat_prefix: "shixi_smtp_edge"
          max_line_length: 2048
          mime_config:
            enable_mime_parsing: true
            max_body_bytes: 52428800 # 50MB (超过此大小将放弃 MIME 解析防 OOM)
          policy:
            denied_senders:
              - "badguy@hacker.com"
              - "marketing@spam.com"
          security:
            # 可选: OPTIONAL 或 REQUIRED (强制 STARTTLS)
            tls_mode: OPTIONAL

      # 2. 标准的 TCP Proxy Filter (负责把放行的流量转给后端)
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tcp_downstream
          cluster: upstream_smtp_server
      transport_socket: 
        name: envoy.transport_sockets.starttls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.starttls.v3.StartTlsConfig
          cleartext_socket_config: {}
          tls_socket_config:
            common_tls_context: 
              tls_certificates:
              - certificate_chain:
                  filename: "/home/hubin/workspace/envoy-filters_ours/cert.pem"
                private_key:
                  filename: "/home/hubin/workspace/envoy-filters_ours/key.pem"

  clusters:
  - name: upstream_smtp_server
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: upstream_smtp_server
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # 这里配置你真实的后端 SMTP 服务器地址 (例如 postfix/exim)
                address: 127.0.0.1 
                port_value: 2500