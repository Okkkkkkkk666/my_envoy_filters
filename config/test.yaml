admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 19000

static_resources:
  secrets:
  - name: mysql_fpe_key
    generic_secret:
      secret:
        inline_string: "secret_key_for_fpe"

  clusters:
  - name: mysql_backend
    type: STRICT_DNS
    connect_timeout: 3s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: mysql_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 3306

  listeners:
  - name: mysql_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 13306
    filter_chains:
    - filters:
      - name: envoy.filters.network.mysql_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.mysql_proxy.v3.MySQLProxy
          stat_prefix: mysql_stats
          fpe_secret:
            name: mysql_fpe_key
          protected_columns:
          - database: testdb
            table: users
            column: name
          - database: testdb
            table: users
            column: email
          - database: testdb
            table: users
            column: phone

      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: mysql_tcp
          cluster: mysql_backend
          idle_timeout: 0s