        http_filters:

        - name: envoy.filters.http.body-to-metadata.1.0
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.body_to_metadata.v3.BodyToMetadataGlobal
            request_rule:
              max_body_bytes: 104857600
        # - name: envoy.filters.http.cors
        #   typed_config:
        #     '@type': type.googleapis.com/envoy.config.route.v3.CorsPolicy
        - name: envoy.filters.http.lua
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                request_handle:headers():add("sr-vsmatched","false");
              end

