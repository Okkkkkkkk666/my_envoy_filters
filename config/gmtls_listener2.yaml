resources:
- '@type': type.googleapis.com/envoy.config.listener.v3.Listener
  name: listener_0
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 1000
  filter_chains:
  - transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
        common_tls_context:
          alpn_protocols:
          - h2,http/1.1
          - http/1.1
          tls_params:
            tls_minimum_protocol_version: TLSv1_1
            tls_maximum_protocol_version: TLSv1_3
            cipher_suites:
            - TLS_RSA_WITH_AES_128_CBC_SHA
            - TLS_RSA_WITH_AES_256_CBC_SHA
            - TLS_PSK_WITH_AES_128_CBC_SHA
            - TLS_PSK_WITH_AES_256_CBC_SHA
            - TLS_RSA_WITH_AES_128_GCM_SHA256
            - TLS_RSA_WITH_AES_256_GCM_SHA384
            - TLS_SM4_GCM_SM3
            - TLS_SM4_CCM_SM3
            ecdh_curves:
            - X25519
            - P-256
          tls_certificates:
          - certificate_chain:
              inline_string: |
                -----BEGIN CERTIFICATE-----
                MIIBtjCCAV0CFHRB1p+XWpjQQTE0lKk+X+BE0u0iMAoGCCqBHM9VAYN1MFwxCzAJ
                BgNVBAYTAkNOMRAwDgYDVQQIDAdCZWlqaW5nMRAwDgYDVQQHDAdCZWlqaW5nMQ0w
