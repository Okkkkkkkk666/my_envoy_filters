syntax = "proto3";

package envoy.admin.v3;

import "google/protobuf/any.proto";
import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";

option java_package = "io.envoyproxy.envoy.admin.v3";
option java_outer_classname = "SrhinoPluginDumpProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/admin/v3;adminv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

message SrhinoPluginsDump {
  InstalledPlugins installed_plugins = 1;
  BindedPlugins binded_plugins = 2;
}

message InstalledPlugins {
  message InstalledPlugin {
    string name = 1;
    repeated google.protobuf.Any controllers = 2;
  }

  repeated InstalledPlugin plugins = 1;
}

message BindedPlugins {
  message BindedPlugin {
    string name = 1;
    uint64 config_ptr = 2;
  }

  repeated BindedPlugin plugins = 1;
}

