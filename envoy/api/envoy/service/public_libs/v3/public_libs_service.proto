syntax = "proto3";
package envoy.service.public_libs_service.v3;

import "validate/validate.proto";
import "google/protobuf/empty.proto";
import "udpa/annotations/status.proto";
import "udpa/annotations/versioning.proto";

option java_package = "io.envoyproxy.envoy.service.publiclibs.v3";
option java_outer_classname = "PublicLibsServiceProto";
option java_multiple_files = true;
option java_generic_services = true;
option (udpa.annotations.file_status).package_version_status = ACTIVE;

service LibsService {
  // 拉取配置
  rpc GetFull(google.protobuf.Empty) returns (GetFullResponse) {
  }

  rpc AddFull(Request) returns (Response){
  }

  rpc Delete(Request) returns (Response) {
  }

  rpc Update(Request) returns (Response) {
  }
}

message Rule {
  // 规则id
  string rule_id = 1;
  // 规则内容
  string data = 2;
}

message Policy {
  // 策略名称
  string policy_name = 1;
  repeated Rule rule = 2;
}

message GetFullResponse {
  repeated Policy policy = 1;
}

message Request {
  repeated Policy policy = 1;
}

message Response {
  // 更新结果，0-失败、1-成功
  int32 result = 1;
}
