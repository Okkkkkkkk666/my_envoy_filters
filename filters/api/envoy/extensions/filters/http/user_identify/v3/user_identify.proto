syntax = "proto3";

package envoy.extensions.filters.http.user_identify.v3;

import "envoy/config/core/v3/grpc_service.proto";
import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.user_identify.v3";
option java_outer_classname = "UserIdentifyProto";
option java_multiple_files = true;
option go_package = "github.com/ouryun/envoy/filters/api/envoy/extensions/filters/http/user_identify/v3;user_identifyv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

message Customization {
  // 业务
  repeated string cluster_name = 1;
  // url
  repeated string url = 2;
  // 用户名字段
  repeated string user_name = 3;
  // 是否启用该业务，true:启用 false:禁用
  bool enabled = 4;
  //业务的中文名
  string common_info_name = 5;
}

message Customize {
  repeated Customization customization = 1;
}

message UserIdentifyGlobal {
  oneof Mode {
    // 自动 true:启用 false:禁用
    bool auto_mode = 1;
    // 自定义模式
    Customize customize = 2;
  }
  // 加载用户识别正则的文件路径
  string url_filename = 4;

  string user_filename = 5;

  string token_filename = 6;

  string guest_filename = 7;

  envoy.config.core.v3.GrpcService grpc = 8;
}

message UserIdentifyRoute {
}
