syntax = "proto3";

package envoy.extensions.filters.http.acl.v3;

import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.acl.v3";
option java_outer_classname = "AclLog";
option java_multiple_files = true;
option go_package = "git.ouryun.cn/base/envoy-go-proto/filters/api/envoy/extensions/filters/http/acl/v3;aclv3";

message AclLog {
  enum Action {
    ALLOW = 0;
    DENY = 1;
    RECORD = 2;
  }

  // 插件拒绝还是放行
  int32 act = 1 [(validate.rules).int32 = {gte: 0, lte: 2}];
  // 下游IP及端口 e.g. `111.111.111.111:8888`
  string downstream = 2;
  // 规则名称
  string rule_name = 3;
  // 用户名
  string username = 4;
}
