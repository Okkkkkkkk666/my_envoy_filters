syntax = "proto3";

package envoy.extensions.filters.http.strong_global_ratelimit.v3;

import "envoy/config/core/v3/address.proto";
import "envoy/config/route/v3/route_components.proto";
import "filters/api/envoy/extensions/filters/http/common/strong_matcher/v3/matcher.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

import "envoy/config/core/v3/grpc_service.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.strong_global_ratelimit.v3";
option java_outer_classname = "StrongglobalRateLimitProto";
option java_multiple_files = true;
option go_package = "git.ouryun.cn/base/envoy-go-proto/filters/api/envoy/extensions/filters/http/strong_global_ratelimit/v3;strong_global_ratelimitv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// 流量配额
message Quota {
  // 时间段，单位秒
  uint32 duration = 1;

  // 在一个duration内最多允许多少次访问
  uint32 max_count = 2;
}

message RateLimitPolicy {

  string key = 1 [(validate.rules).string = {min_len: 1}];

  // 配额
  repeated Quota quota = 2 [(validate.rules).repeated = {min_items: 1 max_items: 2}];

  //是否添加响应头
  bool add_headers = 3;

  // 封禁时间
  uint32 block_time = 4;
}

// 限速动作
message Action {
  // 顺利通过限流后的下一步动作
  enum AfterPass {
    // 结束当前流控插件处理逻辑，进入下一个插件处理
    RETURN = 0;

    // 继续下一条规则
    NEXT_RULE = 1;
  }

  // 配额作用域
  enum Target {
    // 所有访问来源共享配额
    ALL = 0;

    // 每个IP一个配额
    IP = 1;

    // 指定HTTP头的不同值，拥有不同配额
    HEADER = 2;

    // 相同用户共享一组配额
    USER= 3;
  }

  // 流量配额
  repeated Quota quotas = 1 [(validate.rules).repeated = {min_items: 1 max_items: 2}];

  // 流量配额作用域
  Target target = 2 [(validate.rules).enum = {defined_only: true}];

  // 若配额作用为HTTP头，则需指明是哪个头
  envoy.config.route.v3.HeaderMatcher header = 3;

  bool dryrun = 4;

  // 顺利通过限流后的下一步动作
  AfterPass after_pass = 5 [(validate.rules).enum = {defined_only: true}];

  // 是否添加请求头，已废弃
  bool add_headers = 6 [deprecated = true];

}

// 限速规则
message Rule {

  // 规则名称
  string rule_name = 1;

  // 启用
  bool enable = 2;

  repeated envoy.extensions.filters.http.common.strong_matcher.v3.Matcher condition = 3
      [(validate.rules).repeated = {max_items: 256}];

  Action action = 4;

  // 路由id，(waf使用字段)
  repeated uint32 route_id = 5 [(validate.rules).repeated = {max_items: 256}];

  // 上游集群名。已废弃
  string upstream = 6 [(validate.rules).string = {max_len: 128}, deprecated = true];

  // 源IP。已废弃
  oneof from {
    envoy.config.core.v3.CidrRange src_ip = 7 [deprecated = true];

    envoy.extensions.filters.http.common.strong_matcher.v3.IpSet ip_list = 8 [deprecated = true];
  }
  bool ip_invert = 9 [deprecated = true];
}

message StrongGlobalRateLimitRoute {

  // 规则
  repeated Rule rules = 1 [(validate.rules).repeated = {max_items: 256}];

  // 外部调用限速标记
  bool external_invoke = 2;

  // 路由规则是否启用，仅为控制面序列化使用，禁用则不下发，数据面不用处理
  bool enable = 3;

  // 空转。已废弃
  bool dryrun = 4 [deprecated = true];
}

message StrongGlobalRateLimitGlobal {
  //外部限速服务
  envoy.config.core.v3.GrpcService grpc = 1 [(validate.rules).message = {required: true}];
}
