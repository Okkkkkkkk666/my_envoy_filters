syntax = "proto3";

package envoy.extensions.filters.http.srhino_plugin_loader.v3;

import "google/protobuf/struct.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.srhino_plugin_loader.v3";
option java_outer_classname = "SrhinoPluginLoaderProto";
option java_multiple_files = true;
option go_package = "git.ouryun.cn/base/envoy-go-proto/filters/api/envoy/extensions/filters/http/srhino_plugin_loader/v3;srhino_plugin_loaderv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

message SrhinoPluginLoaderGlobal {
  string plugin_file_name = 1 [(validate.rules).string = {min_len: 1 max_len: 255}];
  google.protobuf.Struct config = 2;
}

message SrhinoPluginLoaderPerRoute {
  string plugin_file_name = 1 [(validate.rules).string = {min_len: 1 max_len: 255}];
  google.protobuf.Struct config = 2;
}
